[pytest]
testpaths = tests
# os quatro projetos de src/ (funciona antes do pip install -e; depois vira redundante)
pythonpath = src/Domain src/Application src/Infrastructure src/Web .
addopts = -ra --strict-markers
markers =
    unit: lógica pura, sem banco, sem Flask, sem rede e sem modelo de IA (marcado automaticamente em tests/unit)
    integration: banco SQLite, rotas Flask, MediaPipe/YOLO reais (marcado automaticamente em tests/integration)
    models: usa MediaPipe Pose, YOLOv8 ou Py-Feat de verdade (pula se o peso não foi baixado)
    azure: chama o Azure Speech/Language de verdade; só roda com --azure ou RUN_AZURE_TESTS=1
filterwarnings =
    ignore::DeprecationWarning
