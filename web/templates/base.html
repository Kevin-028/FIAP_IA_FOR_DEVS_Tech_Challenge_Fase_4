<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}FIAP — Fase 4{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}" />
</head>
<body class="fiap-app">
  <div class="fiap-shell">
    {% include "partials/sidebar.html" %}
    <div class="fiap-workspace">
      <header class="fiap-topbar">
        <button type="button" class="fiap-sidebar-toggle" id="fiapSidebarToggle"
                aria-controls="fiapSidebar" aria-expanded="false" aria-label="Abrir menu">
          <span></span><span></span><span></span>
        </button>
        <div class="fiap-topbar-title">
          <span class="fiap-topbar-kicker">Tech Challenge</span>
          <strong>{% block page_heading %}Fase 4{% endblock %}</strong>
        </div>
        <div class="fiap-topbar-actions">
          <a href="/alertas" class="btn btn-sm fiap-btn-primary">Alertas{% if open_alert_count %} ({{ open_alert_count }}){% endif %}</a>
        </div>
      </header>
      <main class="fiap-main">
        {% block content %}{% endblock %}
      </main>
      <footer class="fiap-footer">
        <span>{{ edu_disclaimer }}</span>
      </footer>
    </div>
  </div>
  <div class="fiap-sidebar-backdrop" id="fiapSidebarBackdrop" hidden></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    (function () {
      var shell = document.querySelector(".fiap-shell");
      var btn = document.getElementById("fiapSidebarToggle");
      var backdrop = document.getElementById("fiapSidebarBackdrop");
      if (!shell || !btn) return;

      function setOpen(open) {
        shell.classList.toggle("sidebar-open", open);
        btn.setAttribute("aria-expanded", open ? "true" : "false");
        btn.setAttribute("aria-label", open ? "Fechar menu" : "Abrir menu");
        if (backdrop) backdrop.hidden = !open;
      }

      function isDesktop() {
        return window.matchMedia("(min-width: 992px)").matches;
      }

      btn.addEventListener("click", function () {
        if (isDesktop()) return;
        setOpen(!shell.classList.contains("sidebar-open"));
      });
      if (backdrop) {
        backdrop.addEventListener("click", function () {
          if (isDesktop()) return;
          setOpen(false);
        });
      }
      document.addEventListener("keydown", function (event) {
        if (event.key !== "Escape" || isDesktop()) return;
        setOpen(false);
      });
      window.addEventListener("resize", function () {
        if (isDesktop()) setOpen(false);
      });
    })();
  </script>
</body>
</html>
